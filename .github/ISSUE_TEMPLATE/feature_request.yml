name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "## Feature Request"
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: "e.g. I can't attach images to a Grok thread right now"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the feature you'd like
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat / messaging
        - AI provider integration
        - Skills / connectors
        - Settings / keys
        - PWA / Android install
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false
