name: Bug Report
description: Something is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "## Bug Report"
  - type: dropdown
    id: provider
    attributes:
      label: Which AI provider / thread?
      options:
        - Hermes
        - Grok 4.5
        - Claude
        - ChatGPT
        - Ollama
        - Other / Not provider-related
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug clearly
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open chat with ...
        2. Type ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Device / environment
      placeholder: "e.g. Pixel 8 / Android 15 / Chrome 126 / PWA installed"
    validations:
      required: false
